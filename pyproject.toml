[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "friday-ru"
version = "0.2.0"
description = "F.R.I.D.A.Y. — универсальная ИИ-разведка и подготовка персонального аутрича для любого бизнеса в РФ (Agent-as-Brain)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = [
    "sales",
    "ai-agent",
    "prospecting",
    "yandex",
    "2gis",
    "hh-ru",
    "b2b-russia",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "pyyaml>=6.0.1,<7",
    "python-dotenv>=1.0.1,<2",
    "httpx>=0.27.0,<1",
    "beautifulsoup4>=4.12.3,<5",
    "aiosqlite>=0.19,<1",
    "pydantic>=2.5,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.9,<1",
    "rich>=13.7,<15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "respx>=0.21,<1",
]

[project.urls]
Homepage = "https://github.com/Everick-Ven/F.R.I.D.A.Y."
Issues = "https://github.com/Everick-Ven/F.R.I.D.A.Y./issues"

[project.scripts]
friday = "friday.cli:main"

[tool.setuptools.packages.find]
include = ["friday*"]

[tool.setuptools.package-data]
friday = ["web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
