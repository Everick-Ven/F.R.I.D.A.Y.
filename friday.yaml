# Шаблон конфигурации F.R.I.D.A.Y. (необученное состояние, как в Harvey).
# ПЕРВЫЙ ЭТАП РАБОТЫ — задать вашу нишу и продукт:
#   • скажите ИИ-агенту в чате: «Настрой F.R.I.D.A.Y. под мою нишу: ...» или «Обучись на сайте https://...»
#   • либо запустите `friday train <url_или_описание>` / откройте вкладку «1. Ниша и продукт» в `friday dashboard`.
# Реальные настройки автоматически сохраняются в `friday.local.yaml` (он в .gitignore).

persona:
  name: "Ваше имя"
  company: "Ваша компания"
  role: "Основатель / Руководитель направления"
  telegram: ""
  website: ""
  tone: "деловой, спокойный, уважительный, без спама и рекламных штампов"
  address_style: "polite_name"   # polite_name (на «вы» по имени) | formal_vy (на «вы» по Имени-Отчеству)

product:
  name: "Ваш продукт или услуга"
  category: ""                   # Например: B2B SaaS, маркетинг, интеграция CRM, производство, логистика, консалтинг
  description: "Опишите, что делает ваш продукт/услуга и какую задачу бизнеса он решает"
  pricing: ""                    # Например: "от 45 000 ₽/мес" или "расчёт под проект"
  key_benefits: []
  objection_responses: {}
  offer:
    entry: ""                    # Лёгкий первый шаг: бесплатный аудит, демо, тестовый период, расчёт сметы
    goal: "get_reply"            # get_reply | book_call | send_audit
  primary_channels:
    - "telegram"
    - "email"

# Целевой профиль клиентов (ICP) — заполняется на Шаге 1 под любую нишу рынка РФ
icp:
  niche: ""                      # Например: "Стоматологические клиники", "Застройщики ИЖС", "Селлеры и интернет-магазины"
  industries: []                 # Отрасли клиентов
  search_queries: []             # Поисковые фразы для Яндекса, 2ГИС и Яндекс Карт (без города)
  cities:
    - "Москва"
    - "Санкт-Петербург"
  company_size: "10–200 сотрудников"
  decision_maker_titles:
    - "Собственник"
    - "Основатель"
    - "Генеральный директор"
    - "Коммерческий директор"
    - "Директор по маркетингу"
  # Вакансии на hh.ru, которые сигнализируют, что компания прямо сейчас инвестирует в вашу категорию
  # (например: ["РОП", "Менеджер по продажам"] для CRM, ["Маркетолог", "Директолог"] для трафика)
  hiring_signals: []

# Мозг системы: Вариант А — ИИ-агент рабочей среды (Arena.ai, Cursor, Windsurf, Claude Code)
brain:
  mode: "agent"                  # agent (основной режим: думает сам ИИ-агент среды) | template (быстрый предпросмотр по фактам)

# Правила российского рынка и комплаенса
compliance:
  mode: "recon_and_drafts_only"  # Без автоматической холодной рассылки (ст. 18 ФЗ-38 «О рекламе»)
  enforce_fz38: true             # Ст. 5 ФЗ-38: запрет голословных «№1 / лучший» и обманных 100%-гарантий
  regulated_niche: "none"        # none (обычный B2B/услуги) | medicine (ст. 24 ФЗ-38) | finance (ст. 28 ФЗ-38) | legal_advocates (ст. 17 КПЭА)
  max_telegram_words: 85
  max_email_words: 140
  do_not_contact: []             # Стоп-лист: домены (включая .рф), email или @telegram конкурентов и текущих клиентов

usage:
  discover_max_spend_rub: 300.0
