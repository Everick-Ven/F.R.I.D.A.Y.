# Конфигурация F.R.I.D.A.Y.
# Совет: для реальных боевых настроек скопируйте этот файл в `friday.local.yaml`
# (он в .gitignore и автоматически перекрывает шаблонный `friday.yaml`).

persona:
  name: "Ваше имя"
  company: "Бюро юридического трафика"
  role: "Руководитель бюро"
  telegram: "@your_handle"
  website: "https://legal-traffic.example"
  tone: "спокойный, уважительный, коллегиальный, без рекламного нажима и инфоцыганских обещаний"
  address_style: "formal_vy"     # formal_vy (на «Вы», по Имени-Отчеству где известно) | polite_name (на «Вы» по имени)

bureau:
  name: "Привлечение доверителей для адвокатов и юридических практик"
  description: >
    Настраиваем системное привлечение доверителей для адвокатов, адвокатских бюро
    и коллегий в России (Яндекс.Директ, поисковая видимость в Яндексе, карточки
    в Яндекс Картах и 2ГИС, посадочные страницы по практикам) в строгом соответствии
    с ФЗ-38 «О рекламе» и ст. 17 КПЭА.
  principles:
    - "Работаем строго в рамках ФЗ «О рекламе» (включая маркировку ЕРИР/ОРД) и ст. 17 КПЭА"
    - "Не даём пустых гарантий потока заявок или выигрыша дел — честная экономика и прозрачная аналитика"
    - "Все рекламные кабинеты, домены, Яндекс.Метрика и карточки остаются в собственности и на доступах доверителя"
  entry_offer: "Короткий разбор точек потери обращений по вашей практике в Яндексе и картах (5–7 пунктов без созвона-продажи)"
  primary_channels:
    - "telegram"                 # Ручное персональное сообщение в Telegram после проверки уместности
    - "email"                    # Точечное личное письмо / обращение по конкретному сигналу (не рассылка)
    - "tenchat"                  # Деловой контакт в TenChat

# Чем проект «думает» (оценка практик и подготовка черновиков):
#   claude             — Claude Code CLI по подписке в изолированном режиме без инструментов (как в Harvey)
#   agent              — Режим ИИ-агента рабочей среды (Arena, Cursor, Claude Code, Windsurf): формирует задачи в data/agent_tasks
#   openai_compatible  — Любой OpenAI-совместимый API (OpenRouter, локальный Ollama/vLLM, Qwen, DeepSeek, шлюзы YandexGPT/GigaChat)
#   template           — Детерминированный режим без LLM (формирует структурную сводку и каркас сообщения только по фактам)
brain:
  provider: "claude"
  model: ""                      # Оставьте пустым для модели по умолчанию в подписке Claude, или укажите модель API

# Целевой профиль адвокатских образований и юридических практик (ICP)
icp:
  legal_forms:
    - "Коллегия адвокатов"
    - "Адвокатское бюро"
    - "Адвокатский кабинет"
    - "Юридическая фирма"
  practice_areas:
    - "адвокат по уголовным делам"
    - "адвокат по семейным спорам"
    - "адвокат по арбитражным спорам"
    - "адвокат по банкротству"
    - "адвокат по наследственным делам"
  cities:
    - "Москва"
    - "Санкт-Петербург"
    - "Екатеринбург"
    - "Новосибирск"
    - "Казань"
  decision_maker_titles:
    - "Управляющий партнёр"
    - "Председатель коллегии"
    - "Старший партнёр"
    - "Партнёр"
    - "Руководитель практики"
    - "Адвокат"
    - "Учредитель адвокатского кабинета"
    - "Директор по развитию"
    - "Директор по маркетингу"
  team_size_hint: "от 1 до 50 адвокатов/юристов"

# Правила комплаенса РФ (ФЗ-38 «О рекламе» + КПЭА) и стоп-лист
compliance:
  mode: "recon_and_drafts_only"  # Автоматическая отправка отключена архитектурно (ст. 18 ФЗ «О рекламе»)
  enforce_fz38: true             # Блокировать обещания/гарантии результата и некорректные сравнения (ст. 5 ФЗ-38)
  enforce_kpea: true             # Блокировать формулировки, противоречащие ст. 17 КПЭА (отзывы, оценочные эпитеты)
  max_telegram_words: 85         # Лимит слов для первого короткого касания в Telegram / TenChat
  max_email_words: 140           # Лимит слов для персонального письма-разбора
  do_not_contact: []             # Домены, email или @telegram конкурентов, текущих клиентов и знакомых палат
  # - "competitor-legal.example"
  # - "partner@existing-client.example"

usage:
  max_daily_brain_calls: 100
  discover_max_spend_rub: 300.0
